  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #FDFCF8;
      color: #1C1917;
      margin: 0;
    }

    .serif {
      font-family: 'Playfair Display', serif;
    }

    /* Language Bar */
    .lang-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #1C1917;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: 48px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .lang-btn {
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      border: none;
      background: transparent;
      cursor: pointer;
      position: relative;
      transition: color 0.3s ease;
    }

    .lang-btn:hover {
      color: rgba(255,255,255,0.7);
    }

    .lang-btn.active {
      color: #fff;
    }

    .lang-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 2px;
      background: #A3B18A;
      border-radius: 1px;
    }

    .lang-btn .flag {
      font-size: 14px;
      line-height: 1;
    }

    /* Main Content */
    .main-content {
      padding-top: 48px;
    }

    /* Header */
    .menu-header {
      text-align: center;
      padding: 56px 24px 40px;
      background: linear-gradient(180deg, #F0F4EF 0%, #FDFCF8 100%);
      position: relative;
      overflow: hidden;
    }

    .menu-header::before {
      content: '';
      position: absolute;
      top: -60%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(
        circle,
        rgba(163,177,138,0.15) 0%,
        transparent 70%
      );
      pointer-events: none;
    }

    .menu-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 400;
      line-height: 1.1;
      letter-spacing: -0.025em;
      color: #1C1917;
      margin: 0 0 12px 0;
      position: relative;
    }

    .menu-header h1 em {
      color: #344E41;
      font-style: italic;
    }

    .menu-header p {
      font-size: 15px;
      font-weight: 300;
      color: #78716C;
      line-height: 1.6;
      margin: 0;
      position: relative;
    }

    /* Decorative line */
    .header-line {
      width: 40px;
      height: 2px;
      background: #A3B18A;
      margin: 20px auto 0;
      border-radius: 1px;
      position: relative;
    }

    /* Week Dividers */
    .week-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 24px;
      max-width: 1120px;
      margin: 0 auto 24px;
    }

    .week-divider .line {
      flex: 1;
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        #E7E5E4,
        transparent
      );
    }

    .week-divider span {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #A3B18A;
      white-space: nowrap;
    }

    /* Grid */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px 80px;
    }

    @media (min-width: 768px) {
      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
    }

    /* Day Card */
    .day-card {
      background: #fff;
      border: 1px solid #F5F5F0;
      border-radius: 20px;
      padding: 28px;
      position: relative;
      overflow: hidden;
    }

    .day-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(
        to right,
        #344E41,
        #588157,
        #A3B18A
      );
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .day-card:hover::before {
      opacity: 1;
    }

    .day-card:hover {
      border-color: #E7E5E4;
      box-shadow: 0 8px 30px rgba(52,78,65,0.08);
    }

    /* Day Header */
    .day-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #F5F5F0;
    }

    .day-head .day-label {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 600;
      color: #1C1917;
    }

    .day-head .day-name {
      font-size: 13px;
      font-weight: 400;
      color: #A8A29E;
    }

    /* Meal Row */
    .meal-row {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 12px 10px;
      border-radius: 12px;
    }

    .meal-row + .meal-row {
      margin-top: 2px;
    }

    .meal-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .meal-icon.breakfast {
      background: linear-gradient(135deg, #FEF3C7, #FDE68A);
      color: #92400E;
    }

    .meal-icon.lunch {
      background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
      color: #1E40AF;
    }

    .meal-icon.dinner {
      background: linear-gradient(135deg, #E8EDDF, #D4DDCA);
      color: #344E41;
    }

    .meal-info {
      flex: 1;
      min-width: 0;
    }

    .meal-type-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #A8A29E;
      margin-bottom: 3px;
    }

    .meal-name {
      font-size: 14px;
      font-weight: 500;
      color: #1C1917;
      line-height: 1.4;
      margin: 0;
    }

    .meal-desc {
      font-size: 12px;
      font-weight: 300;
      color: #78716C;
      line-height: 1.5;
      margin: 3px 0 0 0;
    }

    /* Footer */
    .menu-footer {
      text-align: center;
      padding: 40px 24px;
      border-top: 1px solid #F5F5F0;
    }

    .menu-footer p {
      font-size: 12px;
      color: #A8A29E;
      letter-spacing: 0.05em;
      margin: 0;
    }

    /* Smooth scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #D6D3D1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #A8A29E;
    }
  </style>
</head>

        l: { n: "Bramborová polévka", d: "Bramborová polévka se zeleninou" },
        dn: { n: "Pohanka", d: "Pohanka s přílohou" }
      },

      {
        b: { n: "Salát", d: "Zeleninový salát" },
        l: { n: "Těstovinová polévka", d: "Těstovinová polévka se zeleninou" },
        dn: { n: "Boršč", d: "Tradiční boršč" }
      },

      {
        b: { n: "Müsli", d: "Müsli s mlékem" },
        l: { n: "Pohanková polévka", d: "Pohanková polévka se zeleninou" },
        dn: { n: "Těstoviny", d: "Těstoviny s přílohou" }
      },

      {
        b: { n: "Vajíčka", d: "Vajíčka s přílohou" },
        l: { n: "Boršč", d: "Tradiční boršč" },
        dn: { n: "Brambory", d: "Brambory s přílohou" }
      }
    ]

  ]

};


/* Current language */
let currentLang = "en";


/* Render one week */
function renderWeek(weekIdx, containerId) {

  const grid = document.getElementById(containerId);
  const t = i18n[currentLang];
  const data = menuData[currentLang][weekIdx];

  grid.innerHTML = "";

  data.forEach((day, i) => {

    const dateIndex = weekIdx === 0 ? i : i + 7;

    const card = document.createElement("div");

    card.className = "day-card";


    const mealTypes = [

      {
        key: "b",
        label: t.breakfast,
        icon: "lucide:sunrise",
        cls: "breakfast"
      },

      {
        key: "l",
        label: t.lunch,
        icon: "lucide:sun",
        cls: "lunch"
      },

      {
        key: "dn",
        label: t.dinner,
        icon: "lucide:moon",
        cls: "dinner"
      }

    ];


    const mealsHtml = mealTypes.map(mt => `

      <div class="meal-row">

        <div class="meal-icon ${mt.cls}">
          <span
            class="iconify"
            data-icon="${mt.icon}"
            data-width="15"
          ></span>
        </div>

        <div class="meal-info">

          <div class="meal-type-label">
            ${mt.label}
          </div>

          <p class="meal-name">
            ${day[mt.key].n}
          </p>

          <p class="meal-desc">
            ${day[mt.key].d}
          </p>

        </div>

      </div>

    `).join("");


    card.innerHTML = `

      <div class="day-head">

        <span class="day-label">
          ${t.days[dateIndex]}
        </span>

      </div>

      ${mealsHtml}

    `;


    grid.appendChild(card);

  });

}


/* Render everything */
function renderAll() {

  const t = i18n[currentLang];


  document.querySelector(
    "[data-i18n='title']"
  ).innerHTML = t.title;


  document.querySelector(
    "[data-i18n='subtitle']"
  ).textContent = t.subtitle;


  document.querySelector(
    "[data-i18n='week1']"
  ).textContent = t.week1;


  document.querySelector(
    "[data-i18n='week2']"
  ).textContent = t.week2;


  document.querySelector(
    "[data-i18n='footer']"
  ).textContent = t.footer;


  renderWeek(0, "week1Grid");

  renderWeek(1, "week2Grid");

}


/* Language buttons */
document.querySelectorAll(".lang-btn").forEach(btn => {

  btn.addEventListener("click", () => {

    document
      .querySelectorAll(".lang-btn")
      .forEach(b => b.classList.remove("active"));


    btn.classList.add("active");


    currentLang = btn.dataset.lang;


    renderAll();

  });

});


/* Init */
renderAll();

</script>
